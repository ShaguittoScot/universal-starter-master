<div class="text-right">
    <button type="button" class="large-padding pointer no-background light-text" (click)="toggleForm()">
        {{label()}}
        <i class="fa {{icon()}}"></i>
    </button>
</div>


<div class = "lateral-padding overflow-hidden" [@openClose]="formState">
    <input type = "text" placeholder="Que vas a hacer?" [(ngModel)]="todo.content" class="form-control" required min="3">
    <textarea placeholder="Infromacion adicional (opcional)" [(ngModel)]="todo.descripcion"  class="form-control"></textarea>
    <div class="top-space">
        <button type="button" class="btn blue light-text full-widht" (click) = "save()">
            <i class="fa fa-save"> Guardar</i>
        </button>
    </div>
</div>
